# Tesla V100 on the Pi 5 (patched 580.95.05-v100 driver, DKMS). See /root/v100-pi/REVIEW.md, Step 5.
# No autoload by udev (PCI alias) at boot: the GPU is only touched when something asks for it.
blacklist nvidia
blacklist nvidia_uvm
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_peermem
# Explicit loads (nvidia-modprobe from nvidia-smi/libcuda, modprobe) go through the guard:
# overlay active, no crash marker, v100_bar first.
install nvidia /usr/local/sbin/v100-modprobe-guard nvidia $CMDLINE_OPTS
install nvidia_uvm /usr/local/sbin/v100-modprobe-guard nvidia_uvm $CMDLINE_OPTS
# Not used with the V100 (no display); never load.
install nvidia_drm /bin/false
install nvidia_modeset /bin/false
install nvidia_peermem /bin/false
# Parameters proven in runs 18-21 (2026-10-01).
options nvidia nv_pi5_nc_min_pages=2 NVreg_RegistryDwords="RMBar1ApertureSizeMB=8192;RMPcieLinkSpeed=0x800000a8;RMDisableGpuASPMFlags=3"
